[build]
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# SPA catch-all — all paths serve index.html so React Router handles routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
