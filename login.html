<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — RestoreDocAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #f9fafb;
      color: #111827;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    .page-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .top-bar {
      background: #fff; border-bottom: 1px solid #e5e7eb;
      padding: 0 32px; height: 60px;
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .top-bar-logo { font-size: 16px; font-weight: 700; color: #111827; letter-spacing: -0.3px; text-decoration: none; }
    .top-bar-link { font-size: 13px; color: #6b7280; text-decoration: none; }
    .top-bar-link:hover { color: #111827; }
    .top-bar-link span { color: #2563eb; }

    .content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
    .card {
      background: #fff; border: 1px solid #e5e7eb;
      width: 100%; max-width: 400px; padding: 40px;
    }
    .card-logo { font-size: 15px; font-weight: 700; color: #111827; letter-spacing: -0.2px; margin-bottom: 28px; text-decoration: none; display: block; }
    .card-headline { font-size: 22px; font-weight: 700; color: #111827; letter-spacing: -0.4px; margin-bottom: 6px; }
    .card-sub { font-size: 14px; color: #6b7280; margin-bottom: 32px; }

    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
    .form-input {
      display: block; width: 100%; font-family: inherit; font-size: 14px;
      color: #111827; background: #fff; border: 1px solid #e5e7eb;
      padding: 9px 12px; outline: none; transition: border-color 120ms; -webkit-appearance: none;
    }
    .form-input:focus { border-color: #2563eb; }
    .form-input.error { border-color: #ef4444; }
    .form-input::placeholder { color: #9ca3af; }
    .form-error { font-size: 12px; color: #ef4444; margin-top: 5px; display: none; }
    .form-error.visible { display: block; }

    .form-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 6px;
    }
    .forgot-link { font-size: 12px; color: #2563eb; text-decoration: none; }
    .forgot-link:hover { text-decoration: underline; }

    .remember-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 24px;
    }
    .remember-row input[type="checkbox"] { accent-color: #2563eb; }
    .remember-row label { font-size: 13px; color: #6b7280; cursor: pointer; }

    .alert { padding: 12px 16px; border: 1px solid; font-size: 13px; margin-bottom: 20px; display: none; }
    .alert.visible { display: block; }
    .alert-error { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }

    .btn-full {
      display: block; width: 100%; font-family: inherit; font-size: 14px; font-weight: 600;
      color: #fff; background: #2563eb; border: 1px solid #2563eb;
      padding: 11px 0; cursor: pointer; transition: background 120ms; letter-spacing: -0.01em;
    }
    .btn-full:hover { background: #1d4ed8; border-color: #1d4ed8; }
    .btn-full:disabled { opacity: 0.6; cursor: not-allowed; }

    .form-footer { text-align: center; margin-top: 20px; font-size: 13px; color: #6b7280; }
    .form-footer a { color: #2563eb; text-decoration: none; }
    .form-footer a:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
      .content { padding: 24px 16px; align-items: flex-start; padding-top: 40px; }
    }
  </style>
</head>
<body>
<div class="page-shell">
  <div class="top-bar">
    <a href="index.html" class="top-bar-logo">RestoreDocAI</a>
    <a href="signup.html" class="top-bar-link">No account? <span>Start free trial</span></a>
  </div>

  <div class="content">
    <div class="card">
      <a href="index.html" class="card-logo">RestoreDocAI</a>
      <div class="card-headline">Welcome back</div>
      <div class="card-sub">Log in to your account to continue.</div>

      <div class="alert alert-error" id="alertError"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input class="form-input" type="email" id="email" name="email" placeholder="you@company.com" autocomplete="email" required />
          <div class="form-error" id="errEmail">A valid email address is required.</div>
        </div>

        <div class="form-group">
          <div class="form-row">
            <label class="form-label" for="password" style="margin-bottom:0;">Password</label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <input class="form-input" type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" required style="margin-top:6px;" />
          <div class="form-error" id="errPassword">Password is required.</div>
        </div>

        <div class="remember-row">
          <input type="checkbox" id="remember" name="remember" />
          <label for="remember">Remember me on this device</label>
        </div>

        <button type="submit" class="btn-full" id="submitBtn">Log in</button>
      </form>

      <div class="form-footer">
        Don't have an account? <a href="signup.html">Start free trial</a>
      </div>
    </div>
  </div>
</div>

<script>
  const API = 'https://restoredoc-backend-production.up.railway.app';

  function setInputErr(inputId, errId, msg) {
    document.getElementById(inputId).classList.add('error');
    const el = document.getElementById(errId);
    if (msg) el.textContent = msg;
    el.classList.add('visible');
  }
  function clearInputErr(inputId, errId) {
    document.getElementById(inputId).classList.remove('error');
    document.getElementById(errId).classList.remove('visible');
  }

  document.getElementById('email').addEventListener('blur', () => {
    const val = document.getElementById('email').value.trim();
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)
      ? clearInputErr('email', 'errEmail')
      : setInputErr('email', 'errEmail', 'A valid email address is required.');
  });

  document.getElementById('password').addEventListener('blur', () => {
    document.getElementById('password').value
      ? clearInputErr('password', 'errPassword')
      : setInputErr('password', 'errPassword', 'Password is required.');
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    let valid = true;

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setInputErr('email', 'errEmail'); valid = false; }
    if (!password) { setInputErr('password', 'errPassword'); valid = false; }
    if (!valid) return;

    const btn = document.getElementById('submitBtn');
    const alertEl = document.getElementById('alertError');
    btn.disabled = true;
    btn.textContent = 'Logging in...';
    alertEl.classList.remove('visible');

    try {
      const res = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || data.error || 'Invalid email or password.');
      const token = data.token || data.access_token;
      if (token) sessionStorage.setItem('rdai_token', token);
      window.location.href = 'dashboard.html';
    } catch (err) {
      alertEl.textContent = err.message;
      alertEl.className = 'alert alert-error visible';
      btn.disabled = false;
      btn.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
